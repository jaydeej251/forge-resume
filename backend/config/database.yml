# PostgreSQL. Versions 9.5 and up are supported.
#
# Local: DATABASE_* from .env
# Production: DATABASE_URL from the host (Render / Neon / etc.)
#
# Solid Cache/Queue/Cable gems still resolve named DBs on boot even when the
# app uses memory_store / async adapters — point those names at the same URL.

default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DATABASE_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "resume_builder") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "resume_builder") %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: resume_builder_development

test:
  <<: *default
  database: resume_builder_test

production:
  primary: &primary_production
    adapter: postgresql
    encoding: unicode
    url: <%= ENV["DATABASE_URL"] %>
    max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  cache:
    <<: *primary_production
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    migrations_paths: db/cable_migrate
