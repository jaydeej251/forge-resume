# PostgreSQL. Versions 9.5 and up are supported.
#
# Local: DATABASE_* from .env
# Production: DATABASE_URL from the host (Render / Neon / etc.)

default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DATABASE_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "resume_builder") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "resume_builder") %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: resume_builder_development

test:
  <<: *default
  database: resume_builder_test

# Single database for soft-launch / free-tier hosts.
# Chat uses in-request SSE (not Solid Queue), so multi-DB Solid* is optional later.
production:
  adapter: postgresql
  encoding: unicode
  url: <%= ENV["DATABASE_URL"] %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
