# PostgreSQL. Versions 9.5 and up are supported.
#
# Credentials via environment / .env (see .env.example).

default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DATABASE_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "resume_builder") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "resume_builder") %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: resume_builder_development

test:
  <<: *default
  database: resume_builder_test

production:
  primary: &primary_production
    <<: *default
    database: resume_builder_production
    username: <%= ENV.fetch("DATABASE_USERNAME", "resume_builder") %>
    password: <%= ENV["DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: resume_builder_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: resume_builder_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: resume_builder_production_cable
    migrations_paths: db/cable_migrate
