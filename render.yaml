# Free-tier soft launch: Render web service + Postgres.
# Deploy via Dashboard → New → Blueprint, or create services manually (see README).
#
# Limits to know:
# - Free web spins down after ~15m idle (cold start on next hit)
# - Free Postgres expires after ~30 days unless upgraded
# - Photos on local disk are ephemeral

databases:
  - name: forge-resume-db
    plan: free

services:
  - type: web
    name: forge-resume-api
    runtime: ruby
    plan: free
    rootDir: backend
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: FRONTEND_ORIGINS
        sync: false
      - key: WEB_CONCURRENCY
        value: "1"
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: DATABASE_URL
        fromDatabase:
          name: forge-resume-db
          property: connectionString
